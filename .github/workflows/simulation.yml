# Multi-provider simulation (docs/architecture/simulation-and-sample-apps-spike.md §4.3). Provisional sketch: nightly,
# on demand, and on pull requests labelled `simulation`. It deploys nothing and uses no secrets: providers, keys and the
# CA are generated per run, every host is under .example and the proxy refuses any other name.
name: Simulation
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      scale:
        description: Scenario scale
        default: small
        type: choice
        options: [small]
      screenshots:
        description: Capture the screenshot catalogue
        default: true
        type: boolean
  pull_request:
    types: [labeled, synchronize]
permissions:
  contents: read
concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulation:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'simulation')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build:assets
      - name: Simulation (gate checks G1–G7; fixed-seed replay for G6)
        run: node scripts/sim.mjs --scale ${{ inputs.scale || 'small' }} --seed 7 --replay ${{ (github.event_name != 'workflow_dispatch' || inputs.screenshots) && '--screenshots' || '' }}
      - name: Preserve simulation evidence (manifest, gallery, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation
          path: artifacts/sim/
          if-no-files-found: ignore
          retention-days: 14
