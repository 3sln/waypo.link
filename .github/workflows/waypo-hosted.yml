name: Hosted Waypo engine gate
on:
  push:
    branches: [main]
    paths: ['hosted/waypo/**', '.github/workflows/waypo-hosted.yml']
  pull_request:
    paths: ['hosted/waypo/**', '.github/workflows/waypo-hosted.yml']
  workflow_dispatch:
    inputs:
      e2e:
        description: Run prerelease browser and native Worker integration checks
        type: boolean
        default: false
      snapshots:
        description: Capture billing screenshots during the requested E2E run
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: service
          persist-credentials: false
      - name: Require scoped access to the private reference implementation
        env:
          WAYPO_READ_TOKEN: ${{ secrets.WAYPO_REPOSITORY_READ_TOKEN }}
        run: |
          if [ -z "$WAYPO_READ_TOKEN" ]; then
            echo 'Configure WAYPO_REPOSITORY_READ_TOKEN with contents:read access to 3sln/waypo. No production or billing credentials are needed.' >&2
            exit 1
          fi
      - name: Read the pinned Waypo revision
        id: reference
        working-directory: service
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const ref = readFileSync('hosted/waypo/waypo-ref.txt', 'utf8').trim();
          if (!/^[a-f0-9]{40}$/.test(ref)) throw Error('A full Waypo commit is required');
          appendFileSync(process.env.GITHUB_OUTPUT, `ref=${ref}\n`);
          JS
      - uses: actions/checkout@v4
        with:
          repository: 3sln/waypo
          ref: ${{ steps.reference.outputs.ref }}
          token: ${{ secrets.WAYPO_REPOSITORY_READ_TOKEN }}
          path: waypo
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            waypo/package-lock.json
            service/hosted/waypo/package-lock.json
      - run: npm ci
        working-directory: waypo
      - run: npm ci
        working-directory: service/hosted/waypo
      - name: Engine merge gate
        run: npm test
        working-directory: service/hosted/waypo
      - name: Install prerelease browser
        if: github.event_name == 'workflow_dispatch' && inputs.e2e
        run: npx playwright install --with-deps chromium
        working-directory: waypo
      - name: Prerelease integration checks
        if: github.event_name == 'workflow_dispatch' && inputs.e2e
        run: npm run test:e2e
        working-directory: service/hosted/waypo
        env:
          E2E_SNAPSHOTS: ${{ inputs.snapshots && 'true' || 'false' }}
      - name: Requested billing snapshots
        if: always() && github.event_name == 'workflow_dispatch' && inputs.e2e && inputs.snapshots
        uses: actions/upload-artifact@v4
        with:
          name: hosted-billing-${{ github.run_id }}
          path: service/hosted/waypo/.artifacts/billing
          if-no-files-found: error
          retention-days: 7
